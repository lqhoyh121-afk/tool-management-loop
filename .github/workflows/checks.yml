name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repo-check:
    name: repo-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repository checks
        run: python scripts/repo_checks.py
